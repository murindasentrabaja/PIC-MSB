<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F6F5">
<title>Tracking Produksi · MSB</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pr:#2E6B6B;--bl:var(--pr);--ps:#E3F0EE;--bg:#F4F6F5;--tx:#1E2B2F;--mu:#6B7B80;--ln:#E3E9E7;--ok:#4E8F6D;--rd:#C9524B;--wa:#C48A2C;--B:#6E74B8;--C:#C9924F;--shd:0 10px 30px -12px #1e2b2f2b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{font:500 15px/1.45 'Manrope',system-ui,sans-serif;color:var(--tx);background:radial-gradient(55rem 28rem at 95% -10%,#E4E9F7,transparent 60%),radial-gradient(50rem 28rem at -10% 5%,#E3F1EC,transparent 55%),var(--bg)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;touch-action:manipulation}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
svg{width:1.3em;height:1.3em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{height:100%;max-width:1440px;margin:auto;display:grid;grid-template-rows:auto 1fr auto;grid-template-areas:"hd""mn""nv"}
.hd{grid-area:hd;background:#ffffffb8;backdrop-filter:blur(16px);border-bottom:1px solid var(--ln);box-shadow:var(--shd);padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;border-radius:0 0 26px 26px;z-index:4}
.r1{display:flex;align-items:center;gap:12px}.lg1{width:42px;height:42px;border-radius:14px;background:#fff;padding:4px;border:1px solid var(--ln)}
.who{flex:1;min-width:0}.who b{display:block;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who span{font-size:12.5px;color:var(--mu)}
.clk{text-align:right;font-size:12px;line-height:1.25;color:var(--mu)}.clk b{display:block;font-size:19px;color:var(--tx);font-variant-numeric:tabular-nums}
.gb{width:42px;height:42px;border-radius:14px;background:var(--ps);display:grid;place-items:center;color:var(--pr);transition:.2s}.gb:hover{background:#d3e8e4}.gb:active{transform:scale(.94)}
.spin1 svg{animation:sp .8s linear infinite}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.stat i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}.stat b{display:block;font-size:21px;font-weight:800;line-height:1.05}.stat span{font-size:12px;color:var(--mu)}
.mn{grid-area:mn;overflow:auto;position:relative;overscroll-behavior:contain}
.bar{position:sticky;top:0;z-index:3;background:linear-gradient(var(--bg) 82%,#f4f6f500);padding:12px 14px 6px}
.srch{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--ln);border-radius:16px;padding:0 14px;color:var(--mu);box-shadow:0 4px 14px -8px #1e2b2f26;transition:.2s}
.srch:focus-within{border-color:var(--pr);box-shadow:0 0 0 4px #2e6b6b1c}.srch input{flex:1;min-width:0;border:0;outline:0;padding:13px 0;background:none;font-size:16px;color:var(--tx)}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chip{flex:none;padding:8px 15px;border-radius:99px;background:#fff;border:1px solid var(--ln);font-size:13px;font-weight:700;color:var(--mu);transition:.2s}.chip:hover{border-color:var(--pr);color:var(--pr)}
.chip.on{background:var(--pr);border-color:var(--pr);color:#fff}.chip.on.k1{background:var(--B);border-color:var(--B)}.chip.on.k2{background:var(--C);border-color:var(--C)}.chip.tgc{background:var(--ps);border-color:transparent;color:var(--pr)}
.main{padding:8px 14px 28px;display:flex;flex-direction:column;gap:14px}
.main.progres{display:grid;grid-template-columns:repeat(auto-fill,minmax(18rem,1fr));align-content:start;gap:12px}
.gh{grid-column:1/-1;font-size:14px;font-weight:800;color:var(--pr);margin:8px 2px 0}
/* grup customer */
.cg{background:#ffffffd9;border:1px solid var(--ln);border-radius:24px;box-shadow:var(--shd);overflow:hidden}
.cg>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .2s}
.cg>summary::-webkit-details-marker{display:none}.cg>summary:hover{background:#F6F9F8}
.cav{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:19px;color:var(--pr);background:var(--ps)}
.cgt{flex:1;min-width:0}.cgt b{display:block;font-size:16.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cgt small{font-size:12.5px;color:var(--mu)}
.chev{color:var(--mu);transition:transform .25s}.cg[open] .chev{transform:rotate(90deg)}
.cb{padding:2px 14px 16px;display:flex;flex-direction:column;gap:10px;animation:fd .25s ease-out}
.mh{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14.5px;color:var(--pr);margin-top:8px}.mh::after{content:'';flex:1;height:1px;background:var(--ln)}.mh em{order:2;font-style:normal;font-weight:600;font-size:12px;color:var(--mu)}
.dh{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:700;padding-left:2px}.dot{width:9px;height:9px;border-radius:50%;background:var(--pr);box-shadow:0 0 0 4px var(--ps)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:13px 14px;box-shadow:0 4px 16px -10px #1e2b2f30;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.cg .card{background:#FAFBFA;box-shadow:none}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 26px -14px #1e2b2f40;border-color:#cfe0dc}.card:active{transform:scale(.99)}
.ch{display:flex;align-items:center;gap:12px}
.tile{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,#fff)}
.tile.off{background:#EDF1F0;color:#9AA9AD}
.ct1{flex:1;min-width:0}.ct1 b{display:block;font-weight:800;font-size:15px}.ct1 span{display:block;font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:99px}.bd.B{background:color-mix(in srgb,var(--B) 15%,#fff);color:#4D53A0}.bd.C{background:color-mix(in srgb,var(--C) 20%,#fff);color:#8A5A1E}
.seg{display:flex;gap:4px;margin:12px 0 10px}.seg i{flex:1;height:7px;border-radius:4px;background:#E6ECEA;transition:background .3s}
.cf{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--mu)}.cf svg{width:15px;height:15px}.sp{flex:1}
.sisa{font-weight:700;padding:3px 10px;border-radius:99px;font-size:12px}.sisa.late{background:#F8E5E3;color:#A8433D}.sisa.soon{background:#FBF0DA;color:#8F6416}.sisa.ok{background:#E4F1E9;color:#3F7A5B}.sisa.bl{background:var(--ps);color:var(--pr)}
.act{display:flex;justify-content:flex-end;margin-top:10px}
.fb{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:13px;background:linear-gradient(135deg,#2E6B6B,#41908A);color:#fff;font-weight:800;font-size:14px;box-shadow:0 8px 16px -8px #2e6b6b99;transition:.2s}.fb svg{width:17px;height:17px}.fb:hover{transform:translateY(-1px)}.fb:active{filter:brightness(.92)}
.wt{font-size:12.5px;font-weight:700;color:#8F6416;background:#FBF0DA;padding:7px 12px;border-radius:11px}.wt.dn{color:#3F7A5B;background:#E4F1E9}.wt.na{color:var(--mu);background:#EEF2F1}
/* menu */
.nav{grid-area:nv;display:flex;background:#ffffffe6;backdrop-filter:blur(16px);border-top:1px solid var(--ln);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:4}.brand{display:none}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--mu);padding:2px}
.nav i{width:64px;height:38px;border-radius:99px;display:grid;place-items:center;transition:.25s}.nav i svg{width:24px;height:24px}
.nav .on{color:var(--pr)}.nav .on i{background:var(--ps);box-shadow:inset 0 0 0 1.5px #2e6b6b30}
.pr{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--ln);border-radius:18px;padding:12px 14px}.pr>div:last-child{flex:1}
.prt{display:flex;justify-content:space-between;font-weight:800;margin-bottom:6px}.prt span{color:var(--mu);font-weight:600;font-size:12.5px}
.pb{height:8px;background:#E6ECEA;border-radius:5px;overflow:hidden}.pb i{display:block;height:100%;border-radius:5px;transition:width .6s}
.two{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pf{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:16px;text-align:center}.pf b{font-size:24px}
.av{width:68px;height:68px;border-radius:22px;margin:0 auto 10px;display:grid;place-items:center;font-size:28px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--pr),var(--B))}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,#2E6B6B,#41908A);box-shadow:0 10px 20px -10px #2e6b6bb0;transition:.2s}
.btn:hover{transform:translateY(-1px)}.btn.g{background:#fff;color:var(--pr);border:1px solid var(--ln);box-shadow:none}.btn.r{background:#F8E5E3;color:#A8433D;box-shadow:none}
.btn.ld::before{content:'';width:16px;height:16px;border:2.5px solid #fff8;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}.btn:disabled{opacity:.85}
.main.profil{max-width:26rem;margin:auto;width:100%}
/* jadwal */
.cw{display:grid;gap:14px}.calc,.dl{background:#ffffffd9;border:1px solid var(--ln);border-radius:24px;padding:14px;box-shadow:var(--shd)}
.cm{display:flex;align-items:center;gap:8px}.cm h2{flex:1;font-size:17px;font-weight:800;text-transform:capitalize}
.cm button{width:38px;height:38px;border-radius:12px;background:var(--ps);color:var(--pr);display:grid;place-items:center}.cm .td2{width:auto;padding:0 14px;font-size:13px;font-weight:800}
.ms{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.ms span{font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px}
.gr{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.gr>u{text-decoration:none;text-align:center;font-size:12px;font-weight:800;color:var(--mu);padding:5px 0}
.dc{position:relative;aspect-ratio:1/.92;border-radius:14px;background:#F6F9F8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:700;border:1.5px solid transparent;transition:.2s}
.dc:hover{background:var(--ps)}.dc.td{border-color:var(--pr)}.dc.sel{background:linear-gradient(135deg,#2E6B6B,#41908A);color:#fff}
.dc span{margin-top:2px;min-width:20px;padding:0 6px;border-radius:99px;font-size:11px;font-weight:800;color:#fff}
.dc .late{background:var(--rd)}.dc .soon{background:var(--wa)}.dc .ok{background:var(--ok)}.dc .bl{background:var(--pr)}.dc.sel span{background:#fff;color:var(--pr)}
.dl h3{font-size:15px;font-weight:800;margin-bottom:10px}.dl .card{margin-bottom:10px;box-shadow:none;background:#FAFBFA}
/* sheet */
.ov{position:fixed;inset:0;background:#1e2b2f59;backdrop-filter:blur(5px);z-index:5;display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:40rem;max-height:92%;overflow:auto;background:#F8FAF9;border-radius:28px 28px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:2px;background:#CBD6D3;margin:0 auto 10px}
.sh1{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.sh1 b{font-size:18px;font-weight:800}.sh1 span{color:var(--mu);font-size:13px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}.info div{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:8px 12px}.info span{display:block;font-size:11.5px;color:var(--mu)}.info b{font-size:13.5px;word-break:break-word}
.note{margin-top:8px;background:#FBF0DA;border-radius:14px;padding:10px 13px;font-size:13.5px}
.tl{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.ti{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:9px 12px}.ti .ok{color:var(--ok);font-weight:700}
.ub{font-size:13px;font-weight:800;color:#A8433D;background:#F8E5E3;padding:8px 12px;border-radius:11px}
/* login */
#login{height:100%;display:grid;place-items:center;padding:18px;position:relative;overflow:hidden;background:#EEF3F1}
.au{position:absolute;inset:0;overflow:hidden}
.au i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.8;animation:fl 16s ease-in-out infinite alternate}
.au i:nth-child(1){width:34rem;height:34rem;background:#A9D6CF;left:-9rem;top:-9rem}
.au i:nth-child(2){width:30rem;height:30rem;background:#C5C9F0;right:-7rem;top:8%;animation-delay:-6s}
.au i:nth-child(3){width:28rem;height:28rem;background:#F3D9B8;left:28%;bottom:-13rem;animation-delay:-11s}
.au::after{content:'';position:absolute;inset:0;background-image:radial-gradient(#2e6b6b30 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:radial-gradient(circle at 50% 45%,#000,transparent 72%);mask-image:radial-gradient(circle at 50% 45%,#000,transparent 72%)}
.lc{position:relative;width:100%;max-width:26rem;background:#ffffffa8;backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid #ffffffd0;border-radius:30px;padding:30px 24px;box-shadow:0 30px 60px -24px #1e2b2f4d;display:flex;flex-direction:column;gap:14px;animation:up .6s cubic-bezier(.2,.8,.2,1)}
.lc img{width:170px;max-width:65%;margin:0 auto}.lc h1{text-align:center;font-size:22px;font-weight:800}.sub{text-align:center;color:var(--mu);font-size:13px;margin-top:-8px}
.lk{text-align:center;color:var(--mu);font-size:12.5px;background:#ffffffa0;border-radius:12px;padding:7px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--mu);margin-bottom:5px}
.fld input,.fld select{display:block;width:100%;padding:14px;font-size:16px;border:1.5px solid var(--ln);border-radius:15px;outline:0;background:#ffffffcc;user-select:text;-webkit-user-select:text;-webkit-appearance:none;appearance:none;transition:.2s}
.fld input:focus,.fld select:focus{border-color:var(--pr);background:#fff;box-shadow:0 0 0 4px #2e6b6b1c}
.pw{position:relative}.pw input{padding-right:52px}.pw button{position:absolute;right:4px;top:4px;bottom:4px;width:44px;display:grid;place-items:center;color:var(--mu)}
.err{background:#F8E5E3;color:#A8433D;border-radius:13px;padding:10px 13px;font-size:13.5px;font-weight:700}
.emp{grid-column:1/-1;text-align:center;color:var(--mu);padding:40px 10px}
.ldr{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:70px 10px;color:var(--mu);font-weight:700}
.ldr div{display:flex;align-items:flex-end;gap:7px;height:38px}.ldr i{width:11px;height:22px;border-radius:6px;background:var(--pr);animation:bar 1.2s ease-in-out infinite}
.ldr i:nth-child(2){background:var(--B);animation-delay:.12s}.ldr i:nth-child(3){background:var(--C);animation-delay:.24s}.ldr i:nth-child(4){background:var(--ok);animation-delay:.36s}.ldr i:nth-child(5){animation-delay:.48s}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:9;background:#1E2B2F;color:#fff;padding:12px 16px;border-radius:16px;font-weight:700;font-size:14px;max-width:92%;display:flex;gap:12px;align-items:center;animation:up .25s;box-shadow:var(--shd)}
.toast.err{background:#A8433D}.toast.ok{background:#2E6B6B}.toast button{color:#fff;font-weight:800;text-decoration:underline}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes up{from{transform:translateY(22px);opacity:0}}@keyframes fd{from{opacity:0}}
@keyframes bar{0%,100%{height:10px;opacity:.45}50%{height:36px;opacity:1}}@keyframes fl{to{transform:translate(6rem,4rem) scale(1.15)}}
@media(min-width:900px){
 #app{grid-template-columns:17rem 1fr;grid-template-rows:auto 1fr;grid-template-areas:"nv hd""nv mn"}
 .hd{padding-top:16px}
 .nav{flex-direction:column;gap:8px;padding:20px 14px;border-top:0;border-right:1px solid var(--ln)}
 .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:16px;padding:4px 8px 20px}.brand img{width:48px}
 .nav button{flex:none;flex-direction:row;gap:14px;font-size:16px;padding:8px 12px;border-radius:18px}.nav button:hover{background:#EEF3F1}.nav .on{background:var(--ps)}
 .nav i{width:44px;height:40px;border-radius:14px}.nav .on i{background:#fff;box-shadow:none}
 .cw{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
 .ov{align-items:center}.sh{border-radius:28px;max-height:88%}.toast{bottom:28px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<section id="login" hidden><div class="au"><i></i><i></i><i></i></div><div class="lc">
  <img src="logo.png" alt="PT Murinda Sentra Baja" onerror="this.remove()">
  <h1>Tracking Produksi</h1>
  <p class="sub">Pantau tahap produksi hingga pengiriman</p>
  <div class="lk"><span class="cd"></span> · <b class="ct"></b> WIB</div>

  <div class="fld"><label for="p">Kata sandi</label><div class="pw"><input id="p" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Ketik kata sandi"><button type="button" id="eye" aria-label="Tampilkan kata sandi"></button></div></div>
  <div id="err" class="err" hidden></div>
  <button class="btn" id="go">Masuk</button>
</div></section>

<section id="app" hidden>
  <header class="hd">

      <div class="clk"><span class="cd"></span><b class="ct"></b></div><button class="gb" id="rf" aria-label="Muat ulang data"></button></div>

  </header>
  <div class="mn" id="mn">

    <div class="main" id="main"></div>
  </div>

</section>
<div class="ov" id="ov" hidden><div class="sh" id="sh"></div></div>

<script>
/* URL Web App Apps Script (…/exec) */

function progres(){const R=D.rows,cnt=k=>R.filter(r=>r.kategori===k).length;let g='',o=`<div class="two"><div class="pf"><div class="tile" style="--c:#6E74B8;margin:0 auto 6px">${ic('box')}</div><b>${cnt('Builtup')}</b><div style="color:var(--mu)">Unit Builtup</div></div><div class="pf"><div class="tile" style="--c:#C9924F;margin:0 auto 6px">${ic('home')}</div><b>${cnt('Counterweight')}</b><div style="color:var(--mu)">Unit Counterweight</div></div></div>`;

  if(!undo)r.stages[k]=res.timestamp;cache();toast('ok',(undo?'Dibatalkan: ':'Tersimpan: ')+SM[k].label,undo?null:()=>fill(n,k,true))}
 catch(e){r.stages[k]=old;render();if(!$('#ov').hidden)sheet(n);toast('err',e.name==='TypeError'?'Tidak ada koneksi. Coba lagi.':e.message)}

$('#eye').onclick=()=>{const p=$('#p');p.type=p.type==='password'?'text':'password';p.focus()};
$('#rf').onclick=()=>load(true);
let qt;$('#q').oninput=e=>{clearTimeout(qt);const v=e.target.value.trim().toLowerCase();qt=setTimeout(()=>{F.q=v;F.lim=60;$('#main').innerHTML=list()},150)};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;if(b.dataset.g==='tg'){if(CL.size)CL.clear();else D.rows.forEach(r=>CL.add(r.customer));return render()}F[b.dataset.g]=b.dataset.v;F.lim=60;render()};
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;V=b.dataset.v;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));render();$('#mn').scrollTop=0};
$('#main').onclick=e=>{const t=e.target;
 if(t.id==='more'){F.lim+=60;return render()}
 if(t.closest('#rf2'))return load(true);
 if(t.closest('#out')){localStorage.removeItem('msb_tp_session');S=null;location.reload();return}
 if(t.closest('.inst'))return dip&&dip.prompt();
 const cm=t.closest('[data-cm]');if(cm){const v=+cm.dataset.cm;if(!v){const n=new Date();CAL.y=n.getFullYear();CAL.m=n.getMonth();CAL.sel=n.toLocaleDateString('en-CA',{timeZone:TZ})}else{const d=new Date(CAL.y,CAL.m+v,1);CAL.y=d.getFullYear();CAL.m=d.getMonth()}return render()}
 const dc=t.closest('[data-d]');if(dc){CAL.sel=dc.dataset.d;return render()}
 const f=t.closest('.fb');if(f)return fill(f.dataset.r,f.dataset.k);
 const c=t.closest('.card');if(c)sheet(c.dataset.o)};
$('#ov').onclick=e=>{if(e.target.id==='ov'||e.target.closest('#x'))return $('#ov').hidden=true;
 const f=e.target.closest('.fb');if(f)return fill(f.dataset.r,f.dataset.k);
 const u=e.target.closest('.ub');if(u&&confirm('Batalkan tahap "'+SM[u.dataset.u].label+'"?'))fill($('#sh').dataset.n,u.dataset.u,true)};
addEventListener('keydown',e=>{if(e.key==='Escape')$('#ov').hidden=true});
setInterval(()=>{if(S&&!document.hidden&&$('#ov').hidden&&document.activeElement!==$('#q'))load(false,true)},90000);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;render()});
addEventListener('appinstalled',()=>{dip=null;render()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
S?enter():($('#login').hidden=false,loadUsers());
