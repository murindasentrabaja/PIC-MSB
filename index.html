<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E40AF">
<title>Tracking Produksi · MSB</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bl:#2563EB;--bg:#EEF2F9;--tx:#0F172A;--mu:#64748B;--ln:#E2E8F0;--ok:#16A34A;--rd:#DC2626;--wa:#F59E0B}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{font:500 14px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;touch-action:manipulation}
svg{width:1.3em;height:1.3em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{height:100%;max-width:1440px;margin:auto;display:grid;grid-template-rows:auto 1fr auto;grid-template-areas:"hd""mn""nv";background:var(--bg)}
.hd{grid-area:hd;background:linear-gradient(120deg,#1E3A8A,#2563EB 55%,#06B6D4);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;border-radius:0 0 22px 22px}
.r1{display:flex;align-items:center;gap:10px}.lg1{height:36px;width:auto;border-radius:11px;background:#fff;padding:7px 10px}
.who{flex:1;min-width:0}.who b{display:block;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who span{font-size:11px;opacity:.85}
.clk{text-align:right;font-size:11px;line-height:1.2;opacity:.95}.clk b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.gb{width:36px;height:36px;border-radius:11px;background:#ffffff2e;display:grid;place-items:center;color:#fff}.gb:active{background:#ffffff59}
.spin1 svg{animation:sp .8s linear infinite}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:#ffffff26;backdrop-filter:blur(8px);border:1px solid #ffffff33;border-radius:13px;padding:7px 10px;display:flex;align-items:center;gap:8px}
.stat i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#fff;color:var(--c)}.stat b{display:block;font-size:17px;font-weight:800;line-height:1}.stat span{font-size:10.5px;opacity:.9}
.mn{grid-area:mn;overflow:auto;position:relative;overscroll-behavior:contain}
.bar{position:sticky;top:0;z-index:3;background:var(--bg);padding:10px 12px 4px}
.srch{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--ln);border-radius:13px;padding:0 12px;color:var(--mu)}
.srch:focus-within{border-color:var(--bl)}.srch input{flex:1;min-width:0;border:0;outline:0;padding:11px 0;background:none;font-size:16px;color:var(--tx)}
.sr{display:flex;gap:8px}.sr .srch{flex:1;min-width:0}.rpb{display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:13px;font-weight:800;font-size:13px;color:#fff;background:linear-gradient(135deg,#7C3AED,#4F46E5);box-shadow:0 4px 10px #4f46e544}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chip{flex:none;padding:6px 12px;border-radius:99px;background:#fff;border:1px solid var(--ln);font-size:12px;font-weight:700;color:var(--mu)}
.chip.on{background:var(--bl);border-color:var(--bl);color:#fff}.chip.on.k1{background:#7C3AED;border-color:#7C3AED}.chip.on.k2{background:#EA580C;border-color:#EA580C}
.main{padding:8px 12px 16px;display:flex;flex-direction:column;gap:10px}
.main.tugas{gap:2px}
.tr{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;border-radius:11px;font-weight:700;font-size:14px}
.tr:hover{background:#E4EAF8}.tr .cv{display:grid;color:var(--mu);transition:transform .15s}.tr.op .cv{transform:rotate(90deg)}
.tr .n{font-size:11.5px;font-weight:700;background:#E2E8F0;color:#475569;padding:1px 8px;border-radius:6px}
.tr.root{background:#E0E7FF;color:#3730A3;font-weight:800;margin-bottom:4px}.tr.root .n{background:#fff;color:#3730A3}
.tr.l0{font-weight:800}.tr.l2{font-weight:600}
.tb{margin-left:10px;padding-left:6px;border-left:2px solid #DBE3F3}
.tc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(19rem,100%),1fr));gap:10px;padding:4px 0 10px}
.main.progres{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));align-content:start}
.gh{grid-column:1/-1;font-size:13px;font-weight:800;color:#1E3A8A;margin:6px 2px 0}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:11px 12px;box-shadow:0 2px 10px #1e3a8a10;cursor:pointer;transition:transform .12s,box-shadow .12s}
.card:hover{box-shadow:0 6px 18px #1e3a8a1f}.card:active{transform:scale(.99)}
.ch{display:flex;align-items:center;gap:10px}
.tile{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));box-shadow:0 4px 10px color-mix(in srgb,var(--c) 40%,transparent)}
.tile.off{background:#E2E8F0;color:#94A3B8;box-shadow:none}
.ct1{flex:1;min-width:0}.ct1 b{display:block;font-weight:800;font-size:14px}.ct1 span{display:block;font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:99px}.bd.B{background:#EDE9FE;color:#6D28D9}.bd.C{background:#FFEDD5;color:#C2410C}
.seg{display:flex;gap:3px;margin:10px 0 8px}.seg i{flex:1;height:6px;border-radius:3px;background:#E2E8F0}
.cf{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mu)}.cf svg{width:14px;height:14px}.sp{flex:1}
.sisa{font-weight:700;padding:2px 8px;border-radius:99px;font-size:11px}.sisa.late{background:#FEE2E2;color:#B91C1C}.sisa.soon{background:#FEF3C7;color:#B45309}.sisa.ok{background:#DCFCE7;color:#15803D}.sisa.bl{background:#DBEAFE;color:#1D4ED8}
.act{display:flex;justify-content:flex-end;margin-top:8px}
.fb{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:11px;background:linear-gradient(135deg,#16A34A,#22C55E);color:#fff;font-weight:800;font-size:13px;box-shadow:0 4px 10px #16a34a44}.fb svg{width:16px;height:16px}.fb:active{filter:brightness(.92)}
.wt{font-size:12px;font-weight:700;color:#B45309;background:#FEF3C7;padding:6px 10px;border-radius:10px}.wt.dn{color:#15803D;background:#DCFCE7}.wt.na{color:var(--mu);background:#F1F5F9}
.nav{grid-area:nv;display:flex;background:#fff;border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}.brand{display:none}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mu);padding:2px}
.nav i{width:44px;height:30px;border-radius:99px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff);transition:.2s}
.nav .on{color:var(--tx)}.nav .on i{color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff));box-shadow:0 4px 10px color-mix(in srgb,var(--c) 45%,transparent)}
.pr{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:10px 12px}.pr>div:last-child{flex:1}
.prt{display:flex;justify-content:space-between;font-weight:800;margin-bottom:5px}.prt span{color:var(--mu);font-weight:600;font-size:11.5px}
.pb{height:7px;background:#E8EEF8;border-radius:4px;overflow:hidden}.pb i{display:block;height:100%;border-radius:4px}
.two{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:14px;text-align:center}.pf b{font-size:22px}
.av{width:64px;height:64px;border-radius:20px;margin:0 auto 8px;display:grid;place-items:center;font-size:26px;font-weight:800;color:#fff;background:linear-gradient(135deg,#7C3AED,#EC4899)}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:13px;font-weight:800;color:#fff;background:linear-gradient(135deg,#1D4ED8,#3B82F6);box-shadow:0 5px 14px #1d4ed844}
.btn.g{background:#fff;color:var(--bl);border:1px solid var(--ln);box-shadow:none}.btn.r{background:#FEE2E2;color:#B91C1C;box-shadow:none}
.main.profil{max-width:26rem;margin:auto;width:100%}
/* jadwal */
.cw{display:grid;gap:12px}.calc,.dl{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:12px}
.cm{display:flex;align-items:center;gap:6px}.cm h2{flex:1;font-size:16px;font-weight:800;text-transform:capitalize}
.cm button{width:34px;height:34px;border-radius:10px;background:#EEF2FF;color:#4338CA;display:grid;place-items:center}.cm .td2{width:auto;padding:0 12px;font-size:12px;font-weight:800}
.ms{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.ms span{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px}
.gr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.gr>u{text-decoration:none;text-align:center;font-size:11px;font-weight:800;color:var(--mu);padding:4px 0}
.dc{position:relative;aspect-ratio:1/.92;border-radius:12px;background:#F8FAFC;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:1.5px solid transparent}
.dc:hover{background:#EEF2FF}.dc.td{border-color:var(--bl)}.dc.sel{background:linear-gradient(135deg,#4F46E5,#7C3AED);color:#fff}
.dc span{margin-top:2px;min-width:20px;padding:0 6px;border-radius:99px;font-size:10.5px;font-weight:800;color:#fff}
.dc .late{background:#DC2626}.dc .soon{background:#F59E0B}.dc .ok{background:#16A34A}.dc .bl{background:#2563EB}.dc.sel span{background:#fff;color:#4338CA}
.dl h3{font-size:14px;font-weight:800;margin-bottom:8px}.dl .card{margin-bottom:8px;box-shadow:none;background:#F8FAFC}
/* sheet */
.ov{position:fixed;inset:0;background:#0f172a80;z-index:5;display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:38rem;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 14px calc(14px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.grab{width:38px;height:4px;border-radius:2px;background:#CBD5E1;margin:0 auto 8px}
.sh1{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sh1 b{font-size:17px;font-weight:800}.sh1 span{color:var(--mu);font-size:12px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:6px}.info div{background:#fff;border:1px solid var(--ln);border-radius:11px;padding:6px 10px}.info span{display:block;font-size:10.5px;color:var(--mu)}.info b{font-size:12.5px;word-break:break-word}
.note{margin-top:6px;background:#FEF9C3;border-radius:11px;padding:8px 11px;font-size:12.5px}
.tl{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.ti{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--ln);border-radius:13px;padding:7px 10px}.ti .ok{color:var(--ok);font-weight:700}
.ub{font-size:12px;font-weight:800;color:#B91C1C;background:#FEE2E2;padding:7px 11px;border-radius:10px}
/* login */
#login{height:100%;display:grid;place-items:center;padding:18px;background:linear-gradient(150deg,#1E3A8A,#2563EB 55%,#06B6D4)}
.lc{width:100%;max-width:25rem;background:#fff;border-radius:24px;padding:24px 20px;box-shadow:0 20px 50px #0f172a55;display:flex;flex-direction:column;gap:12px}
.lc img{width:230px;max-width:85%;margin:0 auto 4px}.lc h1{text-align:center;font-size:19px;font-weight:800}
.lk{text-align:center;color:var(--mu);font-size:12px;background:#F1F5F9;border-radius:10px;padding:6px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-bottom:4px}
.fld input,.fld select{display:block;width:100%;padding:12px;font-size:16px;border:1.5px solid var(--ln);border-radius:12px;outline:0;background:#F8FAFC;-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
.fld input:focus,.fld select:focus{border-color:#3B82F6;background:#fff}
.pw{position:relative}.pw input{padding-right:48px}.pw button{position:absolute;right:4px;top:4px;bottom:4px;width:40px;display:grid;place-items:center;color:var(--mu)}
.err{background:#FEE2E2;color:#B91C1C;border-radius:11px;padding:9px 12px;font-size:12.5px;font-weight:700}
.emp{grid-column:1/-1;text-align:center;color:var(--mu);padding:34px 10px}.spin{width:30px;height:30px;border:4px solid #DBE7FF;border-top-color:var(--bl);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto;grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:9;background:#0F172A;color:#fff;padding:10px 14px;border-radius:13px;font-weight:700;font-size:13px;max-width:92%;display:flex;gap:12px;align-items:center;animation:up .2s}
.toast.err{background:#B91C1C}.toast.ok{background:#15803D}.toast button{color:#fff;font-weight:800;text-decoration:underline}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes up{from{transform:translateY(20px);opacity:0}}
@media(min-width:900px){
 #app{grid-template-columns:15rem 1fr;grid-template-rows:auto 1fr;grid-template-areas:"nv hd""nv mn"}
 .hd{border-radius:0 0 22px 22px;padding-top:14px}
 .nav{flex-direction:column;gap:6px;padding:16px 12px;border-top:0;border-right:1px solid var(--ln)}
 .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;padding:4px 8px 16px}.brand img{width:160px}
 .nav button{flex:none;flex-direction:row;gap:12px;font-size:14px;padding:8px 10px;border-radius:14px}.nav button:hover{background:#F1F5F9}.nav i{width:38px;height:34px;border-radius:12px}
 .cw{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
 .ov{align-items:center}.sh{border-radius:22px;max-height:88%}.toast{bottom:28px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>

<section id="login" hidden><div class="lc">
  <img class="lgo" alt="PT Murinda Sentra Baja">
  <h1>Tracking Produksi</h1>
  <div class="lk"><span class="cd"></span> · <b class="ct"></b> WIB</div>
  <div class="fld"><label for="u">Pengguna</label><select id="u"><option value="">Memuat daftar pengguna…</option></select></div>
  <div class="fld"><label for="p">Kata sandi</label><div class="pw"><input id="p" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Ketik kata sandi"><button type="button" id="eye" aria-label="Tampilkan kata sandi"></button></div></div>
  <div id="err" class="err" hidden></div>
  <button class="btn" id="go">Masuk</button>
</div></section>

<section id="app" hidden>
  <header class="hd">
    <div class="r1"><img class="lg1 lgo" alt="MSB"><div class="who"><b id="nm">-</b><span id="rl">-</span></div>
      <div class="clk"><span class="cd"></span><b class="ct"></b></div><button class="gb" id="rf" aria-label="Muat ulang data"></button></div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="mn" id="mn">
    <div class="bar" id="bar"><div class="sr"><div class="srch"><span id="si"></span><input id="q" type="search" placeholder="Cari kode serial, customer, No. SO"></div><button class="rpb" id="rpb">Laporan</button></div><div class="chips" id="chips"></div></div>
    <div class="main" id="main"></div>
  </div>
  <nav class="nav" id="nav"><div class="brand"><img class="lgo" alt="PT Murinda Sentra Baja"></div></nav>
</section>
<div class="ov" id="ov" hidden><div class="sh" id="sh"></div></div>

 for(let d=1;d<=dim;d++){const k=`${pk}-${String(d).padStart(2,'0')}`,L=by[k]||[];M.push(...L);
  const cl=!L.length?'':L.some(late)?'late':L.every(sent)?'ok':L.some(r=>sc(r)==='soon')?'soon':'bl';
  c+=`<button class="dc${k===td?' td':''}${k===CAL.sel?' sel':''}" data-d="${k}"><b>${d}</b>${L.length?`<span class="${cl}">${L.length}</span>`:''}</button>`}
 const day=(by[CAL.sel]||[]).slice().sort((a,b)=>a.kodeSerial>b.kodeSerial?1:-1);
 return`<div class="cw"><div class="calc"><div class="cm"><button data-cm="-1" aria-label="Bulan sebelumnya">${ic('l')}</button><h2>${new Date(Date.UTC(y,m,15)).toLocaleDateString('id-ID',{month:'long',year:'numeric',timeZone:'UTC'})}</h2><button class="td2" data-cm="0">Hari ini</button><button data-cm="1" aria-label="Bulan berikutnya">${ic('r')}</button></div>
 <div class="ms"><span style="background:#DBEAFE;color:#1D4ED8">${M.length} unit kirim</span><span style="background:#DCFCE7;color:#15803D">${M.filter(sent).length} terkirim</span><span style="background:#FEE2E2;color:#B91C1C">${M.filter(late).length} terlambat</span></div><div class="gr">${c}</div></div>
 <div class="dl"><h3>${fD(CAL.sel)} · ${day.length} unit</h3>${day.length?day.map(card).join(''):'<div class="emp" style="padding:20px">Tidak ada jadwal kirim pada tanggal ini.</div>'}</div></div>`}
function progres(){const R=D.rows,cnt=k=>R.filter(r=>r.kategori===k).length;let g='',o=`<div class="two"><div class="pf"><div class="tile" style="--c:#7C3AED;margin:0 auto 6px">${ic('box')}</div><b>${cnt('Builtup')}</b><div style="color:var(--mu)">Unit Builtup</div></div><div class="pf"><div class="tile" style="--c:#EA580C;margin:0 auto 6px">${ic('home')}</div><b>${cnt('Counterweight')}</b><div style="color:var(--mu)">Unit Counterweight</div></div></div>`;
 ST.forEach(s=>{const ap=R.filter(r=>flow(r).includes(s.key)),dn=ap.filter(r=>r.stages[s.key]).length,p=ap.length?Math.round(dn/ap.length*100):0;
  if(s.grp!==g){g=s.grp;o+=`<div class="gh">${GRP[g]}</div>`}
  o+=`<div class="pr">${tile(s.key)}<div><div class="prt"><b>${s.label}</b><span>${dn}/${ap.length} · ${p}%</span></div><div class="pb"><i style="width:${p}%;background:${s.c}"></i></div></div></div>`});return o}
function profil(){return`<div class="pf"><div class="av">${esc((S.nama||'?')[0].toUpperCase())}</div><b style="font-size:17px">${esc(S.nama)}</b><div style="color:var(--mu)">${esc(S.role)} · Akses: ${esc(S.stageLabel)}</div><div style="color:var(--mu);margin-top:6px;font-size:12px">Sinkron terakhir: ${synced?fDT(synced):'-'}</div></div>
 <button class="btn g" id="rf2">${ic('ref')}Muat ulang data</button><button class="btn inst" hidden>Pasang ke Layar Utama</button><button class="btn r" id="out">${ic('out')}Keluar</button>`}
function render(){if(!S)return;const m=$('#main');
 try{stats();$('#bar').hidden=V!=='tugas';if(V==='tugas')chips();m.className='main '+V;m.innerHTML=V==='tugas'?list():V==='jadwal'?jadwal():V==='progres'?progres():profil();document.querySelectorAll('.inst').forEach(b=>b.hidden=!dip)}
 catch(e){console.error(e);m.className='main';m.innerHTML='<div class="emp">Tampilan gagal dimuat ('+esc(e.message)+')<br><br><button class="btn" id="rf3">Muat ulang aplikasi</button></div>'}}
function sheet(n){const r=D.rows.find(x=>x.row==n);if(!r)return;const f=flow(r);let last='',t='';
 f.forEach((k,i)=>{const s=SM[k],st=state(r,k),later=f.slice(i+1).some(x=>r.stages[x]);
  if(s.grp!==last){last=s.grp;t+=`<div class="gh">${GRP[last]}</div>`}
  let act='';if(canAct(k)){if(st==='ready')act=`<button class="fb" data-r="${n}" data-k="${k}">Isi</button>`;else if(st==='done'&&!later)act=`<button class="ub" data-u="${k}">Batalkan</button>`}
  t+=`<div class="ti">${tile(k,st!=='done')}<div class="ct1"><b>${esc(s.label)}</b><span class="${st==='done'?'ok':''}">${st==='done'?'Selesai '+fDT(r.stages[k]):st==='ready'?'Siap dikerjakan':'Menunggu '+esc(SM[f[i-1]].label)}</span></div>${act}</div>`});
 $('#sh').innerHTML=`<div class="grab"></div><div class="sh1"><div><b>${esc(r.kodeSerial)}</b><br><span>${esc(r.customer)}</span></div><button class="gb" style="background:#E2E8F0;color:var(--tx)" id="x" aria-label="Tutup">${ic('x')}</button></div>
 <div class="info">${[['No. SO',r.noSO],['Tanggal SO',fD(r.tglSO)],['Kode Produk',r.kodeProduk],['Kategori',r.kategori],['Qty',r.qty+' '+(r.satuan||'')],['Berat',r.berat?nf(r.berat)+' kg':'-'],['Tanggal Kirim',fD(r.tglKirim)],['No. PO',r.noPO||'-']].map(([a,b])=>`<div><span>${a}</span><b>${esc(b)}</b></div>`).join('')}</div>
 ${r.catatan?`<div class="note">${esc(r.catatan)}</div>`:''}<div class="tl">${t}</div>`;$('#ov').hidden=false;$('#sh').dataset.n=n}
function toast(t,m,act){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast '+t;e.textContent=m;
 if(act){const b=document.createElement('button');b.textContent='Batalkan';b.onclick=()=>{e.remove();act()};e.append(b)}document.body.append(e);setTimeout(()=>e.remove(),act?5000:2600)}
let _ct;const cache=()=>{clearTimeout(_ct);_ct=setTimeout(()=>{try{localStorage.setItem('msb_tp_cache',JSON.stringify(D))}catch(e){}},800)};
/* isi tahap: tampil langsung (optimistis), simpan di latar belakang */
async function fill(n,k,undo){const r=D.rows.find(x=>x.row==n);if(!r||pend.has(n))return;pend.add(n);
 const old=r.stages[k];r.stages[k]=undo?null:new Date().toISOString();render();if(!$('#ov').hidden)sheet(n);
 try{const res=await api('update',{row:n,stageKey:k,kodeSerial:r.kodeSerial,username:S.username,undo:!!undo});
  if(!res.success)throw new Error(res.message||'Gagal menyimpan');
  if(!undo)r.stages[k]=res.timestamp;cache();toast('ok',(undo?'Dibatalkan: ':'Tersimpan: ')+SM[k].label,undo?null:()=>fill(n,k,true))}
 catch(e){r.stages[k]=old;render();if(!$('#ov').hidden)sheet(n);toast('err',e.name==='TypeError'||e.name==='AbortError'?'Koneksi lambat atau terputus. Coba lagi.':e.message)}
 pend.delete(n)}
let loading=false,lastLoad=0;
async function load(manual,silent){if(loading)return;loading=true;if(!silent)$('#rf').classList.add('spin1');
 try{const d=await api('data');if(!d.success)throw new Error(d.message);if(!pend.size){D=d;synced=d.generatedAt;cache()}lastLoad=Date.now();if(manual)toast('ok','Data diperbarui')}
 catch(e){if(!silent)toast('err',D.rows.length?'Offline — menampilkan data terakhir':(e.message||'Gagal memuat data'))}
 loading=false;$('#rf').classList.remove('spin1');if($('#ov').hidden)render()}
function enter(){$('#login').hidden=true;$('#app').hidden=false;$('#nm').textContent=S.nama;$('#rl').textContent=S.role+' · '+S.stageLabel;
 const c=localStorage.getItem('msb_tp_cache');if(c){try{D=JSON.parse(c)}catch(e){}}
 if(!D.rows.length)$('#main').innerHTML='<div class="spin"></div>';else render();load(false,D.rows.length>0)}
function fillUsers(L){const s=$('#u'),cur=s.value||localStorage.getItem('msb_tp_last')||'';
 s.innerHTML='<option value="">— Pilih pengguna —</option>'+L.map(x=>`<option value="${esc(x.username)}"${x.username===cur?' selected':''}>${esc(x.nama&&x.nama!==x.username?x.nama:x.username)} · ${esc(x.role)}</option>`).join('')}
async function loadUsers(){const c=localStorage.getItem('msb_tp_users');if(c)fillUsers(JSON.parse(c));
 try{const r=await api('users');if(r.success){localStorage.setItem('msb_tp_users',JSON.stringify(r.users));fillUsers(r.users)}}
 catch(e){if(!c)$('#u').innerHTML='<option value="">Gagal memuat — cek koneksi</option>'}}
/* ---- init & event ---- */
$('#si').innerHTML=ic('search');$('#rpb').insertAdjacentHTML('afterbegin',ic('file'));document.querySelectorAll('.lgo').forEach(i=>i.src=LOGO);$('#rf').innerHTML=ic('ref');$('#eye').innerHTML=ic('eye');
$('#nav').insertAdjacentHTML('beforeend',NAV.map(([v,l,i,c],n)=>`<button data-v="${v}" style="--c:${c}"${n?'':' class="on"'}><i>${ic(i)}</i>${l}</button>`).join(''));
$('#go').onclick=async()=>{const e=$('#err'),b=$('#go'),u=$('#u').value,p=$('#p').value;e.hidden=true;
 if(!u||!p){e.textContent='Pilih pengguna dan isi kata sandi';e.hidden=false;return}b.disabled=true;b.textContent='Memeriksa…';
 try{const r=await api('login',{username:u,password:p});
  if(!r.success){e.textContent=r.message;e.hidden=false}else{S=r;localStorage.setItem('msb_tp_session',JSON.stringify(r));localStorage.setItem('msb_tp_last',r.username);enter()}}
 catch(x){e.textContent='Tidak dapat terhubung ke server.';e.hidden=false}
 b.disabled=false;b.textContent='Masuk'};
$('#p').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
$('#eye').onclick=()=>{const p=$('#p');p.type=p.type==='password'?'text':'password';p.focus()};
$('#rf').onclick=()=>load(true);
let qt;$('#q').oninput=e=>{clearTimeout(qt);const v=e.target.value.trim().toLowerCase();qt=setTimeout(()=>{F.q=v;F.lim=30;$('#main').innerHTML=list()},150)};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;F[b.dataset.g]=b.dataset.v;F.lim=30;render()};
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;V=b.dataset.v;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('on',x===b));render();$('#mn').scrollTop=0};
$('#main').onclick=e=>{const t=e.target;
 if(t.closest('#rf2'))return load(true);
 if(t.closest('#rf3'))return location.reload();
 if(t.closest('#out')){localStorage.removeItem('msb_tp_session');S=null;location.reload();return}
 if(t.closest('.inst'))return dip&&dip.prompt();
 const tr=t.closest('[data-t]');if(tr){const k=tr.dataset.t;if(k==='*')OPEN=OPEN&&OPEN.size?new Set():null;else OPEN.has(k)?OPEN.delete(k):OPEN.add(k);return render()}
 const cm=t.closest('[data-cm]');if(cm){const v=+cm.dataset.cm;if(!v){const n=new Date();CAL.y=n.getFullYear();CAL.m=n.getMonth();CAL.sel=DF.format(n)}else{const d=new Date(CAL.y,CAL.m+v,1);CAL.y=d.getFullYear();CAL.m=d.getMonth()}return render()}
 const dc=t.closest('[data-d]');if(dc){CAL.sel=dc.dataset.d;return render()}
 const f=t.closest('.fb');if(f)return fill(f.dataset.r,f.dataset.k);
 const c=t.closest('.card');if(c)sheet(c.dataset.o)};
$('#rpb').onclick=()=>{RP.scope='view';repSheet()};
$('#ov').onclick=e=>{const rs=e.target.closest('[data-rs]');if(rs){RP.scope=rs.dataset.rs;return repSheet()}
 if(e.target.closest('#rprt'))return repPrint();
 if(e.target.closest('#rpdf'))return repPDFgo(e.target.closest('#rpdf'));
 if(e.target.id==='ov'||e.target.closest('#x')){$('#ov').hidden=true;return render()}
 const f=e.target.closest('.fb');if(f)return fill(f.dataset.r,f.dataset.k);
 const u=e.target.closest('.ub');if(u&&confirm('Batalkan tahap "'+SM[u.dataset.u].label+'"?'))fill($('#sh').dataset.n,u.dataset.u,true)};
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden){$('#ov').hidden=true;render()}});
const auto=()=>{if(S&&!document.hidden&&$('#ov').hidden&&document.activeElement!==$('#q')&&Date.now()-lastLoad>60000)load(false,true)};
setInterval(auto,60000);document.addEventListener('visibilitychange',auto);
const inst=()=>document.querySelectorAll('.inst').forEach(b=>b.hidden=!dip);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;inst()});
addEventListener('appinstalled',()=>{dip=null;inst()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
S?enter():($('#login').hidden=false,loadUsers());
</script></body></html>
